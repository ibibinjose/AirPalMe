<!doctype html>

        "alternateName": "AirPal",
        "url": "https://airpal.me/",
        "logo": "https://airpal.me/brand/logo-full.jpg",
        "contactPoint": {
          "@type": "ContactPoint",
          "url": "https://airpal.me/contact",
          "contactType": "customer support"

    <meta property="og:title" content="AirPal.Me · Life Made Easy." />
